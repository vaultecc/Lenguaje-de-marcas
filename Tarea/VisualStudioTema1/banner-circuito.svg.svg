<svg width="300" height="1200" viewBox="0 0 300 1200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="300" height="1200" fill="#111111"/>

  <!-- Líneas verticales tipo circuito -->
  <g stroke="#2a3a44" stroke-width="2" fill="none">
    <path d="M40,0 L40,180 L90,180 L90,400 L40,400 L40,650"/>
    <path d="M150,0 L150,120 L200,120 L200,300 L150,300 L150,520 L220,520 L220,780"/>
    <path d="M260,0 L260,250 L210,250 L210,500 L260,500 L260,900"/>
    <path d="M60,650 L60,850 L120,850 L120,1050 L60,1050 L60,1200"/>
    <path d="M220,780 L220,1000 L170,1000 L170,1200"/>
  </g>

  <!-- Líneas destacadas en azul (acento) -->
  <g stroke="#4fc3f7" stroke-width="2.5" fill="none" opacity="0.8">
    <path d="M90,180 L90,400"/>
    <path d="M150,300 L150,520"/>
    <path d="M60,850 L60,1050"/>
  </g>

  <!-- Nodos (puntos de conexión) -->
  <g fill="#4fc3f7">
    <circle cx="40" cy="180" r="5"/>
    <circle cx="90" cy="400" r="5"/>
    <circle cx="150" cy="120" r="5"/>
    <circle cx="200" cy="300" r="5"/>
    <circle cx="220" cy="520" r="5"/>
    <circle cx="260" cy="250" r="5"/>
    <circle cx="210" cy="500" r="5"/>
    <circle cx="60" cy="850" r="5"/>
    <circle cx="120" cy="1050" r="5"/>
    <circle cx="220" cy="1000" r="5"/>
    <circle cx="170" cy="1000" r="5"/>
  </g>

  <g fill="#2a3a44">
    <circle cx="40" cy="650" r="4"/>
    <circle cx="150" cy="520" r="4"/>
    <circle cx="260" cy="900" r="4"/>
    <circle cx="60" cy="1200" r="4"/>
  </g>

  <!-- Pequeños "chips" rectangulares -->
  <g fill="#1c1c1c" stroke="#4fc3f7" stroke-width="1.5">
    <rect x="25" y="400" width="30" height="20" rx="3"/>
    <rect x="135" y="520" width="30" height="20" rx="3"/>
    <rect x="195" y="780" width="30" height="20" rx="3"/>
    <rect x="45" y="1050" width="30" height="20" rx="3"/>
  </g>
</svg>
