<svg width="300" height="1200" viewBox="0 0 300 1200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="300" height="1200" fill="#0d0d0d"/>

  <!-- Patrón de rejilla tenue de fondo -->
  <g stroke="#1e1e1e" stroke-width="1">
    <path d="M0,100 L300,100"/>
    <path d="M0,250 L300,250"/>
    <path d="M0,400 L300,400"/>
    <path d="M0,550 L300,550"/>
    <path d="M0,700 L300,700"/>
    <path d="M0,850 L300,850"/>
    <path d="M0,1000 L300,1000"/>
    <path d="M0,1150 L300,1150"/>
  </g>

  <!-- Líneas de circuito, estilo más denso -->
  <g stroke="#333" stroke-width="2" fill="none">
    <path d="M30,0 L30,150 L110,150 L110,320"/>
    <path d="M180,0 L180,90 L250,90 L250,280 L190,280 L190,480"/>
    <path d="M270,320 L270,420 L200,420 L200,620"/>
    <path d="M60,320 L60,560 L150,560 L150,760"/>
    <path d="M230,620 L230,760 L160,760 L160,960"/>
    <path d="M90,760 L90,900 L40,900 L40,1100"/>
    <path d="M250,960 L250,1100 L180,1100 L180,1200"/>
    <path d="M110,960 L110,1200"/>
  </g>

  <!-- Acento en verde menta en vez de azul -->
  <g stroke="#66ffcc" stroke-width="2.5" fill="none" opacity="0.85">
    <path d="M110,150 L110,320"/>
    <path d="M190,280 L190,480"/>
    <path d="M150,560 L150,760"/>
    <path d="M90,900 L90,1100"/>
  </g>

  <!-- Nodos -->
  <g fill="#66ffcc">
    <circle cx="110" cy="320" r="5"/>
    <circle cx="190" cy="480" r="5"/>
    <circle cx="150" cy="760" r="5"/>
    <circle cx="90" cy="1100" r="5"/>
    <circle cx="30" cy="150" r="4"/>
    <circle cx="180" cy="90" r="4"/>
    <circle cx="270" cy="320" r="4"/>
  </g>

  <g fill="#444">
    <circle cx="60" cy="560" r="4"/>
    <circle cx="230" cy="620" r="4"/>
    <circle cx="250" cy="960" r="4"/>
    <circle cx="180" cy="1200" r="4"/>
  </g>

  <!-- Chips más grandes, estilo procesador -->
  <g fill="#0d0d0d" stroke="#66ffcc" stroke-width="1.5">
    <rect x="90" y="320" width="40" height="28" rx="4"/>
    <rect x="170" y="480" width="40" height="28" rx="4"/>
    <rect x="130" y="760" width="40" height="28" rx="4"/>
    <rect x="70" y="1100" width="40" height="28" rx="4"/>
  </g>

  <!-- Pequeños "pines" dentro de los chips -->
  <g stroke="#66ffcc" stroke-width="1">
    <path d="M95,320 L95,315 M100,320 L100,315 M105,320 L105,315 M110,320 L110,315 M115,320 L115,315 M120,320 L120,315"/>
    <path d="M175,480 L175,475 M180,480 L180,475 M185,480 L185,475 M190,480 L190,475 M195,480 L195,475 M200,480 L200,475"/>
  </g>
</svg>
